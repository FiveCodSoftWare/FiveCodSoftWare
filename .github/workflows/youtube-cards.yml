name: GitHub Readme YouTube Cards

on:
  schedule:
    # Viernes a las 00:00 hora de Perú (05:00 UTC)
    - cron: "0 5 * * FRI"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Permite que el job haga commit en el repositorio
    permissions:
      contents: write
    steps:
      - uses: DenverCoder1/github-readme-youtube-cards@main
        id: youtube-cards
        with:
          channel_id: UCfGzDFVjHpZN4lqm5VA2Y_g
          comment_tag_name: YOUTUBE-CARDS
          readme_path: README.md

      - name: Mostrar markdown generado
        shell: bash
        env:
          MARKDOWN: ${{ steps.youtube-cards.outputs.markdown }}
        run: |
          echo "OUTPUT: $MARKDOWN"
